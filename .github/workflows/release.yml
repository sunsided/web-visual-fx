name: Release

# Push a semver tag (v1.2.3, or v1.2.3-rc.1 for a prerelease) to create a GitHub release with
# generated notes and the built site + Storybook attached, and to publish the npm package to
# GitHub Packages and npmjs.com. The tag must match the version in package.json.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # See pages.yml for why this is ./ rather than $/.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: Build release archive
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      # No BASE_PATH: SvelteKit emits relative asset paths, so the archive works from any directory.
      - name: Build site and Storybook
        run: |
          yarn build
          yarn build-storybook

      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: tar -czf "web-visual-fx-${TAG}.tar.gz" -C build .

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: web-visual-fx-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build and pack the npm package
        run: |
          yarn package
          yarn pack --out package.tgz

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    # The only job with write access; it runs no project code.
    permissions:
      contents: write
    steps:
      - name: Download archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          # A suffix like -rc.1 marks a prerelease.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "web-visual-fx-${TAG}.tar.gz"

  publish:
    name: Publish to GitHub Packages
    # After the GitHub release, so a failed release doesn't leave a published package behind.
    needs: [build, release]
    runs-on: ubuntu-latest
    # Publishes the tarball built above; runs no project code (lifecycle scripts are skipped).
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sunsided'
          package-manager-cache: false

      # GitHub Packages authenticates with GITHUB_TOKEN; npm's trusted publishing is for npmjs.com.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: | # zizmor: ignore[use-trusted-publishing]
          # Re-runs: a version can only be published once.
          version="${TAG#v}"
          if npm view "@sunsided/web-visual-fx@${version}" version >/dev/null 2>&1; then
            echo "::notice::@sunsided/web-visual-fx@${version} is already published"
            exit 0
          fi
          flags=(--ignore-scripts)
          # Prereleases don't become `latest`.
          if [[ "$TAG" == *-* ]]; then flags+=(--tag next); fi
          npm publish package.tgz "${flags[@]}"

  publish-npm:
    name: Publish to npmjs.com
    # After the GitHub release, so a failed release doesn't leave a published package behind.
    needs: [build, release]
    runs-on: ubuntu-latest
    # Trusted publishing: npm exchanges the workflow's OIDC token, no secret needed. Configure it
    # on npmjs.com under the package's settings (repository sunsided/web-visual-fx, workflow
    # release.yml). Publishes from the tarball built above; lifecycle scripts are skipped.
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          npm_version="$(npm --version)"
          if [[ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]]; then
            echo "::error::npm $npm_version is too old for trusted publishing (needs 11.5.1+)"
            exit 1
          fi
          # Re-runs: a version can only be published once.
          version="${TAG#v}"
          if npm view "@sunsided/web-visual-fx@${version}" version >/dev/null 2>&1; then
            echo "::notice::@sunsided/web-visual-fx@${version} is already on npmjs.com"
            exit 0
          fi
          flags=(--ignore-scripts --access public)
          # Prereleases don't become `latest`.
          if [[ "$TAG" == *-* ]]; then flags+=(--tag next); fi
          npm publish package.tgz "${flags[@]}"
